name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Windows (amd64)
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          go build -o DXHunter.exe `
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }} -H=windowsgui" `
            .

      - name: Build Linux (amd64)
        shell: pwsh
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -o DXHunter-linux-amd64 `
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}" `
            .

      - name: Build macOS Intel (amd64)
        shell: pwsh
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -o DXHunter-darwin-amd64 `
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}" `
            .

      - name: Build macOS Apple Silicon (arm64)
        shell: pwsh
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -o DXHunter-darwin-arm64 `
            -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}" `
            .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DXHunter v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            DXHunter.exe
            DXHunter-linux-amd64
            DXHunter-darwin-amd64
            DXHunter-darwin-arm64
