  grid: "JN36dg"   # Maidenhead locator (4 or 6 chars)
  log_to_file: true
  log_level: INFO # INFO or DEBUG or WARN
  telnetserver: true # not in use for now
  flexradiospot: true
  sendFreqModeToLog4OM: false # if not using a Flex then turn this on to send Freq and Mode to Log4OM which should in turn change the freq on the radio
  # Spot colors — HEX AARRGGBB format (leave empty to use defaults)
  spot_color_new_entity: "#ff3bf908"         # green text
  background_color_new_entity: "#ff000000"   # black bg
  spot_color_new_band: "#fff9f508"           # yellow text
  background_color_new_band: "#ff000000"     # black bg
  spot_color_new_mode: "#fff9a908"           # orange text
  background_color_new_mode: "#ff000000"     # black bg
  spot_color_new_band_mode: "#ffc603fc"      # purple text
  background_color_new_band_mode: "#ff000000" # black bg
  spot_color_new_slot: "#ff91d2ff"           # light blue text
  background_color_new_slot: "#ff000000"     # black bg
  spot_color_my_callsign: "#ffff0000"        # red text
  background_color_my_callsign: "#ff000000"  # black bg
  spot_color_worked: "#ffffffff"             # white text
  background_color_worked: "#ff00c0c0"       # cyan bg
database:
  mysql: false #only one of the two can be true
  sqlite: true
  mysql_db_user: xxxx
  mysql_db_password: xxxxxxxx
  mysql_db_name: xxxxxxx
  mysql_host: 10.10.10.1
  mysql_port: 3306
sqlite:
  sqlite_path: 'C:\Perso\Seafile\Radio\Logs\Log4OM\F4BPO.SQLite' # SQLite Db path of Log4OM
clusters:
  - name: "EU Cluster"
    server: cluster.f4bpo.com
    port: 7300
    login: f4bpo
    password: xxxxxx
    skimmer: true
    ft8: false
    ft4: false
    beacon: false
    command: "SET/FILTER DOC/PASS 1A,3A,4O,9A,9H,C3,CT,CU,DL,E7,EA,EA6,EI,ER,ES,EU,F,G,GD,GI,GJ,GM,GU,GW,HA,HB,HB0,HV,I,IS,IT9,JW,JX,LA,LX,LY,LZ,OE,OH,OH0,OJ0,OK,OM,ON,OY,OZ,PA,S5,SM,SP,SV,SV5,SV9,T7,TA1,TF,TK,UA,UR,YL,YO,YU,Z6,Z3"
    login_prompt: "login:"
    enabled: true
    master: true
    type: cc_cluster  # dxspider, cc_cluster, ar_cluster (vide = auto-détection)
  - name: "NA Cluster"
    server: dxc.k0xm.net
    port: 7300
    login: f4bpo
    password: ""
    skimmer: true
    ft8: false
    ft4: false
    beacon: false
    command: ""
    login_prompt: "login:"
    enabled: true # mettre true pour activer
    master: false
    type: dxspider  # dxspider, cc_cluster, ar_cluster (vide = auto-détection)
flex:
  discovery: false # Radio must be on same LAN than the program
  ip: 10.10.10.100 # if discovery is true no need to put an IP, can be a public or remote ip
  spot_life: 600 #seconds
telnetserver: # Log4OM must be connected to this server ie: localhost:7301 if on same machine as this program else ip:7301
  host: 0.0.0.0
  port: 7301
ftx:
  enabled: false                # Enable WSJT-X / JTDX / MSHV UDP multicast decodes
  multicast: true               # Join multicast group (required for WSJT-X multicast mode)
  multicast_ip: "239.255.0.1"  # Multicast group IP (or leave empty for unicast/broadcast)
  port: 2237                   # UDP port (default 2237 for WSJT-X protocol)
clublog:
  api_key: ""  # Clé API ClubLog pour la détection des DXpeditions
qrz:
  username: ""  # QRZ.com username (XML subscription required)
  password: ""  # QRZ.com password
gotify:
  enable: false
  url: https://gotify.tld.com/message
  token: xxxxxxxx
  NewDXCC: true
  NewBand: false
  NewMode: false
  NewBandAndMode: false
  Watchlist: false
  windows_notify: false 